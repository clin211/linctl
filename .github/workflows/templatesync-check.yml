name: Template Upstream Sync Check

# 在 miniblog-v4 / web-gin 模板 / sync.yaml 任一发生改动时触发：
# 防止"上游 demo 项目改了但 web-gin 模板没同步"导致 linctl 模板逐渐过时。
#
# 详见 docs/META-template-upstream-sync-2026-04-28.md §6。

on:
  pull_request:
    paths:
      - 'miniblog-v4/**'
      - 'linctl/internal/template/templates/web-gin/**'
      - 'linctl/internal/template/templates/web-gin/.sync.yaml'
      - 'linctl/.linctl/upstream-sync.lock.json'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: templatesync check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linctl
    steps:
      - uses: actions/checkout@v4
        with:
          # 上游同步逻辑需要看到 miniblog-v4 全量历史；浅 clone 即可（不需要 fetch-depth=0）
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build linctl
        run: |
          mkdir -p ../bin
          go build -o ../bin/linctl .
          ../bin/linctl version

      - name: Run templatesync check
        id: check
        continue-on-error: true
        run: |
          ../bin/linctl --output json internal templatesync check > /tmp/templatesync.json
          cat /tmp/templatesync.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Comment on PR if drift detected
        if: ${{ failure() || steps.check.outcome == 'failure' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report;
            try {
              report = JSON.parse(fs.readFileSync('/tmp/templatesync.json', 'utf8'));
            } catch (e) {
              core.setFailed('Failed to parse templatesync.json: ' + e.message);
              return;
            }

            if (report.ok) {
              return;  // already in sync; nothing to comment
            }

            const drifts = (report.needsSync || []).map(d => `- \`${d.dst}\` (${d.kind}, owner=${d.owner})`).join('\n');
            const unknowns = (report.unknownNew || []).slice(0, 20).map(s => `- \`${s}\``).join('\n');
            const unknownTail = (report.unknownNew || []).length > 20
              ? `\n\n_…and ${report.unknownNew.length - 20} more (run \`linctl internal templatesync status\` to see all)._`
              : '';

            const body = [
              '## ⚠️ Template Upstream Sync Required',
              '',
              'Changes detected in `miniblog-v4/` (or `sync.yaml`) that have not been synced into `linctl/internal/template/templates/web-gin/`.',
              '',
              drifts ? `### Files needing sync\n\n${drifts}` : '',
              (report.unknownNew && report.unknownNew.length > 0)
                ? `### Unknown new upstream files\n\nThese exist in \`miniblog-v4/\` but are not declared in \`sync.yaml\`. Decide whether to track or ignore them:\n\n${unknowns}${unknownTail}`
                : '',
              '### How to fix locally',
              '',
              '```bash',
              'cd linctl',
              '# inspect what would change',
              'linctl internal templatesync status',
              '',
              '# if upstream changes are correct, sync them in',
              'linctl internal templatesync apply --strategy=ask',
              '',
              '# resolve any conflict markers, then commit',
              'git add internal/template/templates/web-gin .linctl/upstream-sync.lock.json',
              'git commit -m "chore(templates): sync from miniblog-v4"',
              '```',
              '',
              'See [`docs/META-template-upstream-sync-2026-04-28.md`](../blob/main/linctl/docs/META-template-upstream-sync-2026-04-28.md) for full design.',
            ].filter(Boolean).join('\n\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            });

      - name: Fail the job if drift detected
        if: ${{ steps.check.outcome == 'failure' }}
        run: |
          echo "::error::Template upstream sync required. See PR comment for details."
          exit 1
